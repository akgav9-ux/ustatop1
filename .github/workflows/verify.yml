name: Verify UstaTop

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - design-refresh
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible dependency security fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/design-refresh'
        run: npm audit fix

      - name: Commit dependency lockfile updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/design-refresh'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): apply compatible security updates"
          git push

      - name: Dependency security audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,direct:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"
      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
